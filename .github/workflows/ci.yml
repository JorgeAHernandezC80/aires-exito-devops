# Integración continua (CI).
#
# Cuándo corre:
#   - En cada pull request (contra cualquier rama base). Prueba el "merge commit", es decir,
#     cómo quedaría main si se fusiona el PR. Es la ejecución que decide si se puede fusionar.
#   - En cada push a main, para que main siempre tenga un resultado de CI propio.
#   - A mano (workflow_dispatch).
#   Un push a una rama sin PR no dispara CI: para tener CI temprano, abrir el PR como borrador.
#
# Si el lint o alguna prueba falla, el check queda en rojo y el PR no se debe fusionar.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Mínimo privilegio: este workflow solo lee el código.
permissions:
  contents: read

# Un grupo por PR (o por rama, si es push). En los PR, un push nuevo cancela la ejecución
# anterior porque ya quedó vieja. En main nunca se cancela: cada commit de main debe tener
# su resultado, aunque se fusionen dos PR seguidos.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # Versión fija y la misma que en pyproject.toml ([project.optional-dependencies].dev).
      # Con "ruff>=0.6" una versión nueva de ruff podía poner el CI en rojo sin cambiar código.
      - run: pip install "ruff==0.17.6"
      # --output-format=github convierte cada error en una anotación sobre la línea del PR.
      - run: ruff check . --output-format=github
      - run: ruff format --check .

  tests:
    name: Pruebas (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    # Sin este límite, una prueba colgada podría consumir hasta 6 horas de runner.
    timeout-minutes: 10
    strategy:
      # Que una versión falle no cancela las otras: así se ve si el problema es de una sola.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar el paquete con dependencias de desarrollo
        run: pip install -e ".[dev]"
      - name: Ejecutar pytest con cobertura
        run: pytest --cov=aires_exito --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - name: Publicar la cobertura en el resumen del run
        if: matrix.python-version == '3.12'
        run: |
          {
            echo "### Cobertura de pruebas (Python ${{ matrix.python-version }})"
            coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar reporte de cobertura
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: coverage.xml