# Integración continua: se ejecuta en cada push y en cada pull request.
# Si el lint o alguna prueba falla, el PR queda marcado en rojo y no se debería fusionar.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "ruff>=0.6"
      - run: ruff check . --output-format=github
      - run: ruff format --check .

  tests:
    name: Pruebas (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar el paquete con dependencias de desarrollo
        run: pip install -e ".[dev]"
      - name: Ejecutar pytest con cobertura
        run: pytest --cov=aires_exito --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - name: Guardar reporte de cobertura
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: coverage.xml
